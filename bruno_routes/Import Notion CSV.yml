http:
  method: POST
  url: http://localhost:3000/api/notion/items/import
  body:
    type: file
    data:
      - filePath: C:\Users\haris\Downloads\4bb129d9-716a-4346-94bd-e088690e34b7_ExportBlock-5da8b7ca-0e36-4604-a28d-5a5147aaa6cb.zip
        contentType: application/zip
        selected: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Uploads a CSV file to be mapped into the `notion_items` table.
  Simulates exporting a restricted Company Notion board and importing offline.

  Instructions:
  1. Go to the "Body" tab -> "Form Data".
  2. Add a field named `file`, change its type to "File" 
  3. Browse for the `mock_company_tasks.csv` or a `.zip` Notion Export.
  4. Send request.
